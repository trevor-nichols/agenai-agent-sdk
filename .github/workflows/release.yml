name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm dist-tag for this release
        required: true
        default: beta
        type: choice
        options:
          - beta
          - next
          - latest
      release_ref:
        description: Existing v-prefixed tag for a guarded main-branch recovery
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.release_ref || github.ref_name }}
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && startsWith(inputs.release_ref, 'v'))
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.release_ref != '' && inputs.release_ref || github.ref_name }}
      RELEASE_REF: ${{ inputs.release_ref != '' && format('refs/tags/{0}', inputs.release_ref) || github.ref }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${RELEASE_TAG#v}"
          root_version="$(node --print "require('./package.json').version")"

          if [[ "$RELEASE_TAG" != "v$root_version" || "$RELEASE_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "Release tag $RELEASE_TAG does not match root version $root_version." >&2
            exit 1
          fi

          for manifest in packages/*/package.json; do
            package_version="$(node --print "require('./$manifest').version")"
            if [[ "$package_version" != "$expected_version" ]]; then
              echo "$manifest has version $package_version; expected $expected_version." >&2
              exit 1
            fi
          done

          release_commit="$(git rev-parse "$RELEASE_REF^{commit}")"
          if [[ "$GITHUB_REF" != "$RELEASE_REF" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" || -z "${{ inputs.release_ref }}" ]]; then
              echo "Release recovery must run from main with an explicit release_ref." >&2
              exit 1
            fi
            git diff --exit-code "$release_commit" HEAD -- \
              .npmrc \
              package.json \
              pnpm-lock.yaml \
              pnpm-workspace.yaml \
              tsconfig.base.json \
              packages/validation \
              packages/agent-protocol \
              packages/agent-runtime \
              scripts/architecture/check-agent-sdk-external-consumer.mjs
          elif [[ "$release_commit" != "$GITHUB_SHA" ]]; then
            echo "Release tag $RELEASE_TAG does not resolve to workflow commit $GITHUB_SHA." >&2
            exit 1
          fi
          echo "RELEASE_SHA=$release_commit" >> "$GITHUB_ENV"

      - name: Check SDK
        run: pnpm check

      - name: Pack release tarballs
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          pnpm --filter @agen-ai/validation pack --pack-destination "$GITHUB_WORKSPACE/release"
          pnpm --filter @agen-ai/agent-protocol pack --pack-destination "$GITHUB_WORKSPACE/release"
          pnpm --filter @agen-ai/agent-runtime pack --pack-destination "$GITHUB_WORKSPACE/release"
          ls -1 release/*.tgz

      - name: Inspect validation publication
        id: validation
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-validation-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Publish validation
        if: steps.validation.outputs.action == 'publish'
        run: npm publish ./release/agen-ai-validation-${RELEASE_TAG#v}.tgz --access public --tag "${{ inputs.npm_tag }}"

      - name: Verify validation publication
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-validation-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --require-present --attempts 30 --delay-ms 10000

      - name: Inspect agent protocol publication
        id: agent_protocol
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-agent-protocol-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Publish agent protocol
        if: steps.agent_protocol.outputs.action == 'publish'
        run: npm publish ./release/agen-ai-agent-protocol-${RELEASE_TAG#v}.tgz --access public --tag "${{ inputs.npm_tag }}"

      - name: Verify agent protocol publication
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-agent-protocol-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --require-present --attempts 30 --delay-ms 10000

      - name: Inspect agent runtime publication
        id: agent_runtime
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-agent-runtime-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Publish agent runtime
        if: steps.agent_runtime.outputs.action == 'publish'
        run: npm publish ./release/agen-ai-agent-runtime-${RELEASE_TAG#v}.tgz --access public --tag "${{ inputs.npm_tag }}"

      - name: Verify agent runtime publication
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-agent-runtime-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --require-present --attempts 30 --delay-ms 10000

      - name: Verify registry signatures and provenance
        shell: bash
        run: |
          set -euo pipefail
          verification_root="$(mktemp -d)"
          trap 'find "$verification_root" -depth -delete' EXIT
          cd "$verification_root"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund \
            "@agen-ai/validation@${RELEASE_TAG#v}" \
            "@agen-ai/agent-protocol@${RELEASE_TAG#v}" \
            "@agen-ai/agent-runtime@${RELEASE_TAG#v}"
          npm audit signatures
