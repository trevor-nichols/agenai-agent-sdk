name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm dist-tag for this release
        required: true
        default: beta
        type: choice
        options:
          - beta
          - next
          - latest
      release_ref:
        description: Existing v-prefixed tag for a guarded main-branch recovery
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.release_ref || github.ref_name }}
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && startsWith(inputs.release_ref, 'v'))
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.release_ref != '' && inputs.release_ref || github.ref_name }}
      RELEASE_REF: ${{ inputs.release_ref != '' && format('refs/tags/{0}', inputs.release_ref) || github.ref }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python for offline registry installation fixtures
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14.4'

      - name: Set up uv for offline registry installation fixtures
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.28'
          enable-cache: false

      - name: Verify registry fixture prerequisites
        run: |
          python3 --version
          uv --version

      - name: Verify release tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          root_version="$(node --print "require('./package.json').version")"

          if [[ "$RELEASE_TAG" != "v$root_version" || "$RELEASE_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "Release tag $RELEASE_TAG does not match root version $root_version." >&2
            exit 1
          fi

          node scripts/release/verify-release-set.mjs --release-ref "$RELEASE_REF"

          release_commit="$(git rev-parse "$RELEASE_REF^{commit}")"
          if [[ "$GITHUB_REF" != "$RELEASE_REF" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" || -z "${{ inputs.release_ref }}" ]]; then
              echo "Release recovery must run from main with an explicit release_ref." >&2
              exit 1
            fi
            git diff --exit-code "$release_commit" HEAD -- \
              .npmrc \
              package.json \
              pnpm-lock.yaml \
              pnpm-workspace.yaml \
              tsconfig.base.json \
              packages/validation \
              packages/agent-protocol \
              packages/agent-runtime \
              packages/agent-orchestration \
              packages/acp-transport \
              packages/provider-acp \
              packages/acp-registry \
              packages/agent-history \
              packages/sandbox \
              packages/sandbox-docker \
              scripts/architecture/check-agent-sdk-external-consumer.mjs \
              scripts/architecture/check-agent-sdk-sandbox-consumer.mjs \
              scripts/development/agent-sandbox-qualification \
              scripts/architecture/agent-sdk-consumers \
              examples
          elif [[ "$release_commit" != "$GITHUB_SHA" ]]; then
            echo "Release tag $RELEASE_TAG does not resolve to workflow commit $GITHUB_SHA." >&2
            exit 1
          fi
          echo "RELEASE_SHA=$release_commit" >> "$GITHUB_ENV"

      - name: Provision Linux native history sandbox
        shell: bash
        env:
          NATIVE_HISTORY_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          NATIVE_HISTORY_RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          if [[ "${NATIVE_HISTORY_RUNNER_ENVIRONMENT:-}" != "github-hosted" || "${NATIVE_HISTORY_RUNNER_OS:-}" != "Linux" || "${ImageOS:-}" != "ubuntu24" ]]; then
            echo "Native history CI setup requires the ephemeral GitHub-hosted Ubuntu 24.04 runner." >&2
            exit 1
          fi
          if [[ ! -x /usr/bin/bwrap ]] || [[ "$(/usr/bin/bwrap --help)" != *"--ro-bind-fd"* ]] || [[ "$(/usr/bin/bwrap --help)" != *"--bind-fd"* ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends bubblewrap
          fi

          apparmor_userns_path=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -e "${apparmor_userns_path}" ]]; then
            read -r apparmor_userns_original < "${apparmor_userns_path}"
            printf 'NATIVE_HISTORY_APPARMOR_USERNS_ORIGINAL=%s\n' "${apparmor_userns_original}" >> "${GITHUB_ENV}"
            if [[ "${apparmor_userns_original}" != "0" ]]; then
              sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
            fi
          fi

          /usr/bin/bwrap \
            --die-with-parent \
            --unshare-user \
            --uid 0 \
            --gid 0 \
            --unshare-net \
            --unshare-pid \
            --ro-bind / / \
            --ro-bind-fd 3 /usr/share \
            --proc /proc \
            --dev /dev \
            --clearenv \
            -- /usr/bin/true 3</usr/share

          history_mount_fixture=$(mktemp -d)
          trap 'rm -rf -- "${history_mount_fixture}"' EXIT
          bwrap --unshare-user --uid 0 --gid 0 --unshare-net --ro-bind / / \
            --bind-fd 3 "${history_mount_fixture}" --proc /proc --dev /dev --clearenv \
            -- /usr/bin/touch "${history_mount_fixture}/written" 3<"${history_mount_fixture}"
          test -f "${history_mount_fixture}/written"

      - name: Check SDK
        run: pnpm check

      - name: Restore Ubuntu native history namespace restriction
        if: always()
        shell: bash
        env:
          NATIVE_HISTORY_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          NATIVE_HISTORY_RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          if [[ -n "${NATIVE_HISTORY_APPARMOR_USERNS_ORIGINAL:-}" ]]; then
            if [[ "${NATIVE_HISTORY_RUNNER_ENVIRONMENT:-}" != "github-hosted" || "${NATIVE_HISTORY_RUNNER_OS:-}" != "Linux" || "${ImageOS:-}" != "ubuntu24" ]]; then
              echo "Refusing a namespace policy change outside the ephemeral Ubuntu 24.04 runner." >&2
              exit 1
            fi
            sudo sysctl --write "kernel.apparmor_restrict_unprivileged_userns=${NATIVE_HISTORY_APPARMOR_USERNS_ORIGINAL}"
          fi


      - name: Pack release tarballs
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          pnpm --filter @agen-ai/validation pack --pack-destination "$GITHUB_WORKSPACE/release"
          pnpm --filter @agen-ai/agent-protocol pack --pack-destination "$GITHUB_WORKSPACE/release"
          pnpm --filter @agen-ai/agent-runtime pack --pack-destination "$GITHUB_WORKSPACE/release"
          pnpm --filter @agen-ai/agent-orchestration pack --pack-destination "$GITHUB_WORKSPACE/release"
          pnpm --filter @agen-ai/acp-transport pack --pack-destination "$GITHUB_WORKSPACE/release"
          pnpm --filter @agen-ai/provider-acp pack --pack-destination "$GITHUB_WORKSPACE/release"
          pnpm --filter @agen-ai/acp-registry pack --pack-destination "$GITHUB_WORKSPACE/release"
          pnpm --filter @agen-ai/agent-history pack --pack-destination "$GITHUB_WORKSPACE/release"
          pnpm --filter @agen-ai/sandbox pack --pack-destination "$GITHUB_WORKSPACE/release"
          pnpm --filter @agen-ai/sandbox-docker pack --pack-destination "$GITHUB_WORKSPACE/release"
          ls -1 release/*.tgz

      - name: Verify complete release artifact set
        run: >-
          node scripts/release/verify-release-set.mjs
          --release-ref "$RELEASE_REF" --release-directory release

      - name: Retain exact pre-publication artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-${{ env.RELEASE_TAG }}-attempt-${{ github.run_attempt }}
          path: |
            release/*.tgz
            pnpm-lock.yaml
            .agenai-export.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Inspect validation publication
        id: validation
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-validation-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Publish validation
        if: steps.validation.outputs.action == 'publish'
        run: npm publish ./release/agen-ai-validation-${RELEASE_TAG#v}.tgz --access public --tag "${{ inputs.npm_tag }}"

      - name: Verify validation publication
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-validation-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --require-present --attempts 90 --delay-ms 10000

      - name: Inspect agent protocol publication
        id: agent_protocol
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-agent-protocol-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Publish agent protocol
        if: steps.agent_protocol.outputs.action == 'publish'
        run: npm publish ./release/agen-ai-agent-protocol-${RELEASE_TAG#v}.tgz --access public --tag "${{ inputs.npm_tag }}"

      - name: Verify agent protocol publication
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-agent-protocol-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --require-present --attempts 90 --delay-ms 10000

      - name: Inspect agent runtime publication
        id: agent_runtime
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-agent-runtime-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Publish agent runtime
        if: steps.agent_runtime.outputs.action == 'publish'
        run: npm publish ./release/agen-ai-agent-runtime-${RELEASE_TAG#v}.tgz --access public --tag "${{ inputs.npm_tag }}"

      - name: Verify agent runtime publication
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-agent-runtime-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --require-present --attempts 90 --delay-ms 10000

      - name: Inspect agent orchestration publication
        id: agent_orchestration
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-agent-orchestration-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Publish agent orchestration
        if: steps.agent_orchestration.outputs.action == 'publish'
        run: npm publish ./release/agen-ai-agent-orchestration-${RELEASE_TAG#v}.tgz --access public --tag "${{ inputs.npm_tag }}"

      - name: Verify agent orchestration publication
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-agent-orchestration-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --require-present --attempts 90 --delay-ms 10000

      - name: Inspect ACP transport publication
        id: acp_transport
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-acp-transport-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Publish ACP transport
        if: steps.acp_transport.outputs.action == 'publish'
        run: npm publish ./release/agen-ai-acp-transport-${RELEASE_TAG#v}.tgz --access public --tag "${{ inputs.npm_tag }}"

      - name: Verify ACP transport publication
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-acp-transport-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --require-present --attempts 90 --delay-ms 10000

      - name: Inspect ACP provider publication
        id: provider_acp
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-provider-acp-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Publish ACP provider
        if: steps.provider_acp.outputs.action == 'publish'
        run: npm publish ./release/agen-ai-provider-acp-${RELEASE_TAG#v}.tgz --access public --tag "${{ inputs.npm_tag }}"

      - name: Verify ACP provider publication
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-provider-acp-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --require-present --attempts 90 --delay-ms 10000

      - name: Inspect ACP registry publication
        id: acp_registry
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-acp-registry-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Publish ACP registry
        if: steps.acp_registry.outputs.action == 'publish'
        run: npm publish ./release/agen-ai-acp-registry-${RELEASE_TAG#v}.tgz --access public --tag "${{ inputs.npm_tag }}"

      - name: Verify ACP registry publication
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-acp-registry-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --require-present --attempts 90 --delay-ms 10000

      - name: Inspect agent history publication
        id: agent_history
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-agent-history-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Publish agent history
        if: steps.agent_history.outputs.action == 'publish'
        run: npm publish ./release/agen-ai-agent-history-${RELEASE_TAG#v}.tgz --access public --tag "${{ inputs.npm_tag }}"

      - name: Verify agent history publication
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-agent-history-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --require-present --attempts 90 --delay-ms 10000

      - name: Inspect sandbox publication
        id: sandbox
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-sandbox-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Publish sandbox
        if: steps.sandbox.outputs.action == 'publish'
        run: npm publish ./release/agen-ai-sandbox-${RELEASE_TAG#v}.tgz --access public --tag "${{ inputs.npm_tag }}"

      - name: Verify sandbox publication
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-sandbox-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --require-present --attempts 90 --delay-ms 10000

      - name: Inspect Docker sandbox publication
        id: sandbox_docker
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-sandbox-docker-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Publish Docker sandbox
        if: steps.sandbox_docker.outputs.action == 'publish'
        run: npm publish ./release/agen-ai-sandbox-docker-${RELEASE_TAG#v}.tgz --access public --tag "${{ inputs.npm_tag }}"

      - name: Verify Docker sandbox publication
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-sandbox-docker-${RELEASE_TAG#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --release-ref "$RELEASE_REF"
          --release-sha "$RELEASE_SHA"
          --require-present --attempts 90 --delay-ms 10000

      - name: Verify registry signatures and provenance
        shell: bash
        run: |
          set -euo pipefail
          verification_root="$(mktemp -d)"
          trap 'find "$verification_root" -depth -delete' EXIT
          cd "$verification_root"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund \
            "@agen-ai/validation@${RELEASE_TAG#v}" \
            "@agen-ai/agent-protocol@${RELEASE_TAG#v}" \
            "@agen-ai/agent-runtime@${RELEASE_TAG#v}" \
            "@agen-ai/agent-orchestration@${RELEASE_TAG#v}" \
            "@agen-ai/acp-transport@${RELEASE_TAG#v}" \
            "@agen-ai/provider-acp@${RELEASE_TAG#v}" \
            "@agen-ai/acp-registry@${RELEASE_TAG#v}" \
            "@agen-ai/agent-history@${RELEASE_TAG#v}" \
            "@agen-ai/sandbox@${RELEASE_TAG#v}" \
            "@agen-ai/sandbox-docker@${RELEASE_TAG#v}"
          npm audit signatures
