name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm dist-tag for this release
        required: true
        default: beta
        type: choice
        options:
          - beta
          - next
          - latest

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${GITHUB_REF_NAME#v}"
          root_version="$(node --print "require('./package.json').version")"

          if [[ "$GITHUB_REF_NAME" != "v$root_version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match root version $root_version." >&2
            exit 1
          fi

          for manifest in packages/*/package.json; do
            package_version="$(node --print "require('./$manifest').version")"
            if [[ "$package_version" != "$expected_version" ]]; then
              echo "$manifest has version $package_version; expected $expected_version." >&2
              exit 1
            fi
          done

      - name: Check SDK
        run: pnpm check

      - name: Pack release tarballs
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          pnpm --filter @agenai/validation pack --pack-destination "$GITHUB_WORKSPACE/release"
          pnpm --filter @agenai/agent-protocol pack --pack-destination "$GITHUB_WORKSPACE/release"
          pnpm --filter @agenai/agent-runtime pack --pack-destination "$GITHUB_WORKSPACE/release"
          ls -1 release/*.tgz

      - name: Publish validation
        run: npm publish release/agenai-validation-${GITHUB_REF_NAME#v}.tgz --access public --tag "${{ inputs.npm_tag }}"

      - name: Publish agent protocol
        run: npm publish release/agenai-agent-protocol-${GITHUB_REF_NAME#v}.tgz --access public --tag "${{ inputs.npm_tag }}"

      - name: Publish agent runtime
        run: npm publish release/agenai-agent-runtime-${GITHUB_REF_NAME#v}.tgz --access public --tag "${{ inputs.npm_tag }}"
