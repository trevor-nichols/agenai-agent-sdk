name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm dist-tag for this release
        required: true
        default: beta
        type: choice
        options:
          - beta
          - next
          - latest

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${GITHUB_REF_NAME#v}"
          root_version="$(node --print "require('./package.json').version")"

          if [[ "$GITHUB_REF_NAME" != "v$root_version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match root version $root_version." >&2
            exit 1
          fi

          for manifest in packages/*/package.json; do
            package_version="$(node --print "require('./$manifest').version")"
            if [[ "$package_version" != "$expected_version" ]]; then
              echo "$manifest has version $package_version; expected $expected_version." >&2
              exit 1
            fi
          done

      - name: Check SDK
        run: pnpm check

      - name: Pack release tarballs
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          pnpm --filter @agen-ai/validation pack --pack-destination "$GITHUB_WORKSPACE/release"
          pnpm --filter @agen-ai/agent-protocol pack --pack-destination "$GITHUB_WORKSPACE/release"
          pnpm --filter @agen-ai/agent-runtime pack --pack-destination "$GITHUB_WORKSPACE/release"
          ls -1 release/*.tgz

      - name: Inspect validation publication
        id: validation
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-validation-${GITHUB_REF_NAME#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --github-output "$GITHUB_OUTPUT"

      - name: Publish validation
        if: steps.validation.outputs.action == 'publish'
        run: npm publish release/agen-ai-validation-${GITHUB_REF_NAME#v}.tgz --access public --tag "${{ inputs.npm_tag }}"

      - name: Verify validation publication
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-validation-${GITHUB_REF_NAME#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --require-present --attempts 20 --delay-ms 3000

      - name: Inspect agent protocol publication
        id: agent_protocol
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-agent-protocol-${GITHUB_REF_NAME#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --github-output "$GITHUB_OUTPUT"

      - name: Publish agent protocol
        if: steps.agent_protocol.outputs.action == 'publish'
        run: npm publish release/agen-ai-agent-protocol-${GITHUB_REF_NAME#v}.tgz --access public --tag "${{ inputs.npm_tag }}"

      - name: Verify agent protocol publication
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-agent-protocol-${GITHUB_REF_NAME#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --require-present --attempts 20 --delay-ms 3000

      - name: Inspect agent runtime publication
        id: agent_runtime
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-agent-runtime-${GITHUB_REF_NAME#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --github-output "$GITHUB_OUTPUT"

      - name: Publish agent runtime
        if: steps.agent_runtime.outputs.action == 'publish'
        run: npm publish release/agen-ai-agent-runtime-${GITHUB_REF_NAME#v}.tgz --access public --tag "${{ inputs.npm_tag }}"

      - name: Verify agent runtime publication
        run: >-
          node scripts/release/verify-package-publication.mjs
          --tarball release/agen-ai-agent-runtime-${GITHUB_REF_NAME#v}.tgz
          --npm-tag "${{ inputs.npm_tag }}"
          --require-present --attempts 20 --delay-ms 3000

      - name: Verify registry signatures and provenance
        shell: bash
        run: |
          set -euo pipefail
          verification_root="$(mktemp -d)"
          trap 'find "$verification_root" -depth -delete' EXIT
          cd "$verification_root"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund \
            "@agen-ai/validation@${GITHUB_REF_NAME#v}" \
            "@agen-ai/agent-protocol@${GITHUB_REF_NAME#v}" \
            "@agen-ai/agent-runtime@${GITHUB_REF_NAME#v}"
          npm audit signatures
